name: AI News Hub - تحديث الأخبار التلقائي

on:
  schedule:
    # Every 3 hours for near-real-time updates
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'سبب التحديث اليدوي'
        required: false
        default: 'تحديث يدوي'

jobs:
  fetch-news:
    name: جلب آخر الأخبار العالمية
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 تحميل المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔧 إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🤖 جلب الأخبار من 56 مصدراً
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/fetch-news.js

      - name: 📤 رفع التغييرات للمستودع
        run: |
          git config user.name "AI News Bot"
          git config user.email "bot@ai-news-hub.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "🤖 تحديث الأخبار التلقائي $(date +'%Y-%m-%d %H:%M UTC')" && \
             git push origin main)